schemaVersion: "1"
kind: mixin
name: statusline
displayName: Custom Statusline
description: >-
  Custom Claude Code statusline: model + effort level, current directory,
  a context-window usage bar, and 5h/7d quota usage.

commands:
  startup:
    - command:
        - bash
        - -c
        - |
          set -eu
          script="/home/agent/.claude/statusline-command.sh"
          settings="/home/agent/.claude/settings.json"

          # static kit files land without the executable bit set
          chmod +x "$script"

          # jq can't edit a file in place, so write to a temp file and swap it in
          tmp="$(mktemp)"

          # set statusLine to run the bundled script
          jq --arg cmd "bash $script" '.statusLine = {"type": "command", "command": $cmd}' "$settings" > "$tmp" && mv "$tmp" "$settings"
      description: Point statusLine at the bundled script. Runs on every start because the sandbox reseeds settings.json after kit files are applied.
