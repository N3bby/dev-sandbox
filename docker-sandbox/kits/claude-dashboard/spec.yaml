schemaVersion: "1"
kind: mixin
name: claude-dashboard
displayName: Claude Dashboard plugin
description: >-
  Installs the private claude-dashboard Claude Code plugin from
  github.com/N3bby/claude-dashboard and points it at the dashboard server.

caps:
  network:
    allow:
      - "github.com:443"
      - "api.github.com:443"
      - "100.127.103.89/32" # Tailscale CIDR range

commands:
  install:
    - command: claude plugin marketplace add https://github.com/N3bby/claude-dashboard.git
      user: "1000"
      description: Register the claude-dashboard marketplace

    - command: claude plugin install claude-dashboard@claude-dashboard --config serverUrl=http://100.127.103.89:4317
      user: "1000"
      description: Install and configure the claude-dashboard plugin

  startup:
    - command:
        - bash
        - -c
        - |
          set -eu
          settings="/home/agent/.claude/settings.json"

          # jq can't edit a file in place, so write to a temp file and swap it in
          tmp="$(mktemp)"

          # turn the plugin on
          jq '.enabledPlugins["claude-dashboard@claude-dashboard"] = true' "$settings" > "$tmp" && mv "$tmp" "$settings"

          # tell it which server to talk to
          jq '.pluginConfigs["claude-dashboard@claude-dashboard"].options.serverUrl = "http://100.127.103.89:4317"' "$settings" > "$tmp" && mv "$tmp" "$settings"
      description: >-
        Reassert the plugin stays enabled and configured, since settings.json is reseeded on every start.
