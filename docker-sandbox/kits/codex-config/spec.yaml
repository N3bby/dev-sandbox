schemaVersion: "1"
kind: mixin
name: codex-config
displayName: Codex configuration
description: >-
  Applies opinionated Codex CLI defaults without replacing the authentication
  and model-provider configuration supplied by the sandbox image.

commands:
  startup:
    - command:
        - bash
        - -c
        - |
          set -eu
          config="/home/agent/.codex/config.toml"
          mkdir -p "$(dirname "$config")"
          touch "$config"

          # Replace an existing tui.notifications value, or add it to the
          # existing [tui] table. Append a new table when none exists.
          tmp="$(mktemp "$(dirname "$config")/.config.toml.XXXXXX")"
          awk '
            BEGIN { in_tui = 0; saw_tui = 0; set_notifications = 0 }
            /^\[tui\][[:space:]]*$/ {
              in_tui = 1
              saw_tui = 1
              print
              next
            }
            /^\[/ {
              if (in_tui && !set_notifications) {
                print "notifications = false"
                set_notifications = 1
              }
              in_tui = 0
            }
            in_tui && /^[[:space:]]*notifications[[:space:]]*=/ {
              if (!set_notifications) {
                print "notifications = false"
                set_notifications = 1
              }
              next
            }
            { print }
            END {
              if (!saw_tui) {
                print ""
                print "[tui]"
                print "notifications = false"
              } else if (in_tui && !set_notifications) {
                print "notifications = false"
              }
            }
          ' "$config" > "$tmp"
          mv "$tmp" "$config"
      user: "1000"
      description: Disable terminal notifications that can raise or focus the terminal when a turn completes.
