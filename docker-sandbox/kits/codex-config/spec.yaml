schemaVersion: "1"
kind: mixin
name: codex-config
displayName: Codex configuration and dashboard
description: >-
  Configures the Codex CLI and native statusline, installs the dashboard
  plugin, and points it at the dashboard server.

caps:
  network:
    allow:
      - "github.com:443"
      - "api.github.com:443"
      - "100.127.103.89/32" # Dashboard server on Tailscale

environment:
  variables:
    CODEX_STATUS_SERVER_URL: "http://100.127.103.89:4317"

commands:
  install:
    - command: >-
        HOME=/home/agent
        /usr/bin/zsh -lc
        'codex plugin marketplace add N3bby/agent-session-reporter'
      user: "1000"
      description: Register the agent-session-reporter marketplace.

    - command: >-
        HOME=/home/agent
        /usr/bin/zsh -lc
        'codex plugin add codex-dashboard@personal'
      user: "1000"
      description: Install the codex-dashboard plugin.

    - command: |
        set -eu
        export HOME=/home/agent
        export PATH="/home/agent/.asdf/shims:$PATH"
        config="$HOME/.codex/config.toml"
        mkdir -p "$(dirname "$config")"
        touch "$config"

        tomlq -T --in-place '
          .tui.notifications = false |
          .tui.status_line = [
            "model-with-reasoning",
            "current-dir",
            "context-window-size",
            "context-used",
            "five-hour-limit",
            "weekly-limit"
          ]
        ' "$config"
      user: "1000"
      description: Configure Codex defaults and the native TUI footer after installing the plugin.
