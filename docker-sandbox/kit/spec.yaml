# Dev sandbox kit — a MIXIN layered onto the stock `claude` agent.
#
# `kind: mixin` means we do NOT ship a custom template image: the sandbox uses
# the claude agent's default image (docker/sandbox-templates:claude-code), which
# already provides the agent user (UID 1000) + sudo, the injected proxy env,
# git, the Docker CLI *and a working private Docker daemon*, and Node/Python/
# Go/Java. We only layer our extras on top declaratively — zsh/omz + prompt and
# asdf (terraform) — via `commands.install`. No Dockerfile, no build, no
# `sbx template load`.
#
# Applied at creation:  sbx run claude --kit ./docker-sandbox/kit
# (the `dev` wrapper does this for you)
#
# See https://docs.docker.com/ai/sandboxes/customize/kits/

schemaVersion: "1"
kind: mixin
name: dev-sandbox
displayName: Dev Sandbox
description: Layers zsh/omz + prompt and asdf (terraform) onto the claude agent.

# Deny-by-default egress: only these domains are reachable. Covers both the
# one-time install commands below and normal runtime (agent API, git, deps, and
# `sudo apt install` inside the sandbox).
network:
  allowedDomains:
    - api.anthropic.com          # Claude API
    - registry.npmjs.org         # npm
    - pypi.org                   # pip
    - files.pythonhosted.org     # pip package files
    - github.com                 # git, omz, asdf release + plugins
    - api.github.com
    - codeload.github.com
    - objects.githubusercontent.com
    - raw.githubusercontent.com  # omz install script
    - nodejs.org                 # asdf node downloads (if used at runtime)
    - releases.hashicorp.com     # terraform versions
    - registry.terraform.io
    # OS package installs (`sudo apt install …`) — index ships in the base
    # image, but apt still fetches .deb files from these mirrors.
    - archive.ubuntu.com
    - security.ubuntu.com
    - ports.ubuntu.com           # arm64 (Apple Silicon)
    - download.docker.com

# One-time setup at sandbox creation. `user: "0"` runs as root (system
# packages / /usr/local/bin); `user: "1000"` runs as the agent (installs into
# $HOME). Order matters — these run top to bottom.
commands:
  install:
    - command: "apt-get update && apt-get install -y zsh unzip"
      user: "0"
      description: Zsh + unzip

    - command: "curl -fsSL https://github.com/asdf-vm/asdf/releases/download/v0.19.0/asdf-v0.19.0-linux-amd64.tar.gz | tar -xz -C /usr/local/bin"
      user: "0"
      description: Install asdf binary

    - command: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      user: "1000"
      description: Install Oh My Zsh

    # Append our prompt + asdf shims to .zshrc. A quoted heredoc writes the
    # lines verbatim (the $'…' powerline glyphs and $VARs are interpreted later
    # by zsh, not now), which sidesteps YAML/shell escaping headaches.
    - command: |
        cat >> "$HOME/.zshrc" <<'ZRC'
        CAP_LEFT=$'\ue0b6'
        CAP_RIGHT=$'\ue0b4'
        PROMPT="%F{black}${CAP_LEFT}%K{black}%fdev%k%F{black}${CAP_RIGHT}%f%k $PROMPT"
        export PATH="$HOME/.asdf/shims:$PATH"
        ZRC
      user: "1000"
      description: Prompt + asdf PATH in .zshrc

    - command: "asdf plugin add terraform https://github.com/asdf-community/asdf-hashicorp.git"
      user: "1000"
      description: Add asdf terraform plugin

environment:
  variables:
    LANG: C.UTF-8            # so zsh can encode the powerline prompt glyphs
    LC_ALL: C.UTF-8
    COLORTERM: truecolor
    SHELL: /usr/bin/zsh

# Non-secret preferences that should SYNC across machines can be dropped in
# files/ and injected at creation:
#   files/home/       -> /home/agent/
#   files/workspace/  -> primary workspace
# Secrets do NOT go here — set them per machine with `sbx login` / `sbx secret set`.

agentContext: |
  # Dev sandbox
  This is an isolated Docker Sandbox with its own private Docker daemon (the
  host daemon is not reachable). Tools: git, zsh, the Docker CLI, Node/Python/
  Go/Java from the base image, and asdf (terraform plugin). Install more OS
  packages with `sudo apt install <pkg>`.
