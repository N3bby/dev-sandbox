schemaVersion: "1"
kind: mixin
name: statusline
displayName: Custom Statusline
description: >-
  Custom Claude Code statusline: model + effort level, current directory,
  a context-window usage bar, and 5h/7d quota usage.

commands:
  install:
    - command: |
        command -v jq >/dev/null 2>&1 || (apt-get update && apt-get install -y jq)
      description: Ensure jq is available (used to merge settings.json at startup)

  startup:
    - command:
        - bash
        - -c
        - |
          set -eu
          script="/home/agent/.claude/statusline-command.sh"
          settings="/home/agent/.claude/settings.json"
          chmod +x "$script"
          [ -f "$settings" ] || echo '{}' > "$settings"
          tmp="$(mktemp)"
          jq --arg cmd "bash $script" \
            '.statusLine = {"type": "command", "command": $cmd}' \
            "$settings" > "$tmp" && mv "$tmp" "$settings"
      description: >-
        Point statusLine at the bundled script. Runs on every start because
        the sandbox reseeds settings.json after kit files are applied.
